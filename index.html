<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAIRLY – Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Sora:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#07060f;--tx:#ece9f8;--mut:rgba(236,233,248,.65);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(900px 500px at 80% -10%,rgba(139,92,246,.35),transparent),radial-gradient(700px 500px at 0% 100%,rgba(236,72,153,.25),transparent),var(--bg);color:var(--tx);font:16px/1.5 "DM Sans",system-ui,sans-serif;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:520px;background:rgba(255,255,255,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:24px}
h1{font:700 28px Sora,sans-serif;margin:0 0 4px;background:linear-gradient(110deg,#a78bfa,#f472b6 55%,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:700 20px Sora,sans-serif;margin:18px 0 10px}
p{margin:0 0 12px;color:var(--mut);font-size:14px}
label{display:block;font-size:13px;margin:12px 0 4px}
input,select{width:100%;background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--tx);font:inherit}
select option{color:#000}
button{width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px;color:#fff;font:500 16px "DM Sans",sans-serif;cursor:pointer;background:linear-gradient(110deg,#8b5cf6,#ec4899 55%,#38bdf8)}
button.g{background:rgba(255,255,255,.1);color:var(--mut)}
button:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:8px;margin:14px 0 4px}.tabs button{margin:0;padding:10px}
.msg{margin-top:12px;font-size:14px;min-height:20px}.err{color:#fda4af}.ok{color:#86efac}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(56,189,248,.18);color:#7dd3fc;font-size:12px}
.tiny{font-size:12px;color:var(--mut);margin-top:14px}
.sm{width:auto;margin:6px 0 0;padding:6px 12px;font-size:13px}ul.l{padding:0;list-style:none;margin:8px 0}ul.l li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.card2{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.card2 h3{margin:0 0 6px;font:700 17px Sora,sans-serif}.card2 p{margin:0 0 6px}textarea{width:100%;background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--tx);font:inherit}.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}[hidden]{display:none!important}
:focus-visible{outline:2px solid #38bdf8;outline-offset:3px}
</style></head><body>
<main class="box">
<h1>PAIRLY</h1><p>Platonic companionship for verified adults. 18+ only.</p>

<section id="auth">
<div class="tabs"><button class="g" id="tIn" type="button">Log in</button><button class="g" id="tUp" type="button">Sign up</button></div>
<form id="f">
<div id="upOnly" hidden>
<label for="nm">Display name</label><input id="nm" autocomplete="nickname">
<label for="dob">Date of birth (must be 18+)</label><input id="dob" type="date">
<label for="ct">City</label><select id="ct"><option>Dhaka</option><option>Chattogram</option><option>Sylhet</option><option>Gazipur</option><option>Other</option></select>
<label for="rl">I want to</label><select id="rl"><option value="customer">Book companions</option><option value="companion">Offer my time as a companion</option></select>
</div>
<label for="em">Email</label><input id="em" type="email" autocomplete="email" required>
<label for="pw">Password (8+ characters)</label><input id="pw" type="password" minlength="8" autocomplete="current-password" required>
<label id="agree" hidden style="display:flex;gap:8px;align-items:flex-start"><input id="ag" type="checkbox" style="width:auto;margin-top:4px">I am 18 or older and will use PAIRLY for friendly, non-sexual activities only.</label>
<button id="go">Log in</button>
</form>
